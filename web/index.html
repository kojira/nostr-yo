<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src wss: ws://localhost:* ws://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Yo! on Nostr</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1 id="logo"><img src="yo.png" alt="Yo!" width="128" height="128"></h1>
    <p class="tag">Nostr で「Yo!」だけを送り合う。それだけ。</p>
  </header>

  <section class="card" id="auth">
    <button id="login" class="big">🔑 拡張でログイン (NIP-07)</button>
    <p class="small" id="ext">NIP-07 拡張: 確認中…</p>
    <p class="small me-line">あなた: <code id="me">未ログイン</code></p>
  </section>

  <section class="card" id="sendbox">
    <label for="search">フォローから宛先を探す</label>
    <input id="search" placeholder="名前で検索（ログイン後）" autocomplete="off" spellcheck="false" disabled>
    <p class="small" id="follow-state" role="status" aria-live="polite">ログインするとフォローリスト (kind 3) を読み込みます。</p>
    <ul id="search-results" class="search-results"></ul>
    <label for="to">宛先 npub</label>
    <div id="selected" class="selected" hidden></div>
    <input id="to" placeholder="npub1…（手動入力も可）" autocomplete="off" spellcheck="false">
    <button id="send" class="yo-btn">Yo!</button>
    <div id="status" class="status info" role="status" aria-live="polite">秘密鍵はこのサイトに入力しません。署名は拡張が行います。</div>
    <ul id="send-results" class="results"></ul>
  </section>

  <section class="card">
    <h2>受信した Yo</h2>
    <p class="small" id="inbox-note">ログインすると自分宛の Yo を表示します。</p>
    <ul id="inbox"></ul>
  </section>

  <section class="card">
    <h2>Relay</h2>
    <ul id="relays"></ul>
    <form id="relay-form">
      <input id="relay-input" placeholder="wss://…" autocomplete="off">
      <button type="submit">追加</button>
    </form>
  </section>

  <footer class="small">
    Yo = 宛先の kind 0 プロフィールへの kind 7 カスタム絵文字 :yo: リアクション (NIP-25 / NIP-30) + <code>["t","yo"]</code>。
    <a href="https://github.com/kojira/nostr-yo" rel="noopener noreferrer">source &amp; spec</a>
  </footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
